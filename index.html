<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roller Groups BA</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-badge">🛼</div>
        <h1>Roller Groups BA</h1>
        <p>
          Discover roller skating meetups in Buenos Aires with schedules, levels,
          locations, and an interactive map so you never miss a session.
        </p>
      </header>

      <main class="content">
        <section class="map-panel panel">
          <div class="section-heading">
            <h2>Routes map</h2>
            <a
              class="map-link"
              href="https://www.google.com/maps/d/u/0/viewer?mid=1amMKFPvvDQj1IxzfszknTSCP5VmmN9c&usp=sharing"
              target="_blank"
              rel="noopener noreferrer"
            >
              Open full map
            </a>
          </div>

          <iframe
            class="map-frame"
            src="https://www.google.com/maps/d/u/0/embed?mid=1amMKFPvvDQj1IxzfszknTSCP5VmmN9c&ehbc=2E312F"
            loading="lazy"
            title="Interactive map of roller skating routes in Buenos Aires"
          ></iframe>
        </section>

        <section class="toolbar panel">
          <input
            id="searchInput"
            class="search-input"
            type="text"
            placeholder="Search group, day or level..."
            aria-label="Search group"
          />

          <div class="filter-group" id="dayFilters">
            <button class="filter-btn active" type="button" onclick="setDay('All', this)">All</button>
            <button class="filter-btn" type="button" onclick="setDay('Monday', this)">Monday</button>
            <button class="filter-btn" type="button" onclick="setDay('Tuesday', this)">Tuesday</button>
            <button class="filter-btn" type="button" onclick="setDay('Wednesday', this)">Wednesday</button>
            <button class="filter-btn" type="button" onclick="setDay('Thursday', this)">Thursday</button>
            <button class="filter-btn" type="button" onclick="setDay('Friday', this)">Friday</button>
            <button class="filter-btn" type="button" onclick="setDay('Saturday', this)">Saturday</button>
            <button class="filter-btn" type="button" onclick="setDay('Sunday', this)">Sunday</button>
          </div>

          <div class="filter-group" id="levelFilters">
            <button class="filter-btn active" type="button" onclick="setLevel('All', this)">All levels</button>
            <button class="filter-btn" type="button" onclick="setLevel('Beginner', this)">Beginner</button>
            <button class="filter-btn" type="button" onclick="setLevel('Intermediate', this)">Intermediate</button>
            <button class="filter-btn" type="button" onclick="setLevel('Advanced', this)">Advanced</button>
          </div>
        </section>

        <div id="statusBanner" class="status-banner">Loading sessions…</div>

        <section id="groupsContainer" class="groups-grid" aria-live="polite"></section>

        <div id="emptyState" class="empty-state" hidden>
          <h3>🛼 No results found</h3>
          <p>No groups match these filters. Try changing your search or day.</p>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
